services:
  postgres:
    image: postgres:latest
    container_name: trng-2440-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: revature
    ports:
      - "6001:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d revature"]
      interval: 10s
      timeout: 5s
      retries: 5