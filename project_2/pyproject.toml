[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks import after the sys.path bootstrap cell, by necessity.
"notebooks/*" = ["E402"]

[tool.pyright]
reportMissingImports = "warning"
